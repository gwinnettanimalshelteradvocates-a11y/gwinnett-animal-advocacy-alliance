<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>{{ page.title }} | GAAA</title>
  <style>
    :root {
        --primary: #818385;
        --accent: #1C4072;
        --light: #2E8DCC;
        --white: #ffffff;
    }

    body {
        font-family: 'Montserrat', -apple-system, sans-serif;
        margin: 0;
        line-height: 1.6;
        color: var(--primary);
        background-color: var(--white);
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
    }

    /* Navigation & Logo Reset */
    nav {
        background: var(--white);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .logo img {
        height: 65px; /* Adjust this to change logo size */
        width: auto;
        display: block; /* Removes weird spacing under the image */
        vertical-align: middle;
    }

      /* This makes all images in your content area responsive */
    img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 1rem auto; /* Centers the image with some spacing */
        border-radius: 8px; /* Optional: gives it nice rounded corners */
    }
    a {
        text-decoration: none;
        color: var(--light);
        font-weight: bold;
        transition: color 0.3s;
    }

    .nav-links {
        list-style: none;
        display: flex;
        margin: 0;
        padding: 0;
        color: var(--light);
    }

    .nav-links li { margin-left: 20px; }

    .nav-links a {
        text-decoration: none;
        color: var(--light);
        font-weight: bold;
        transition: color 0.3s;
    }

    .nav-links a:hover { color: var(--accent); }
    .dropdown {
    position: relative;
}

    .submenu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background: var(--white);
        list-style: none;
        padding: 10px 0;
        margin: 0;
        min-width: 250px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        z-index: 1000;
    }

.dropdown:hover .submenu {
    display: block;
}

.submenu li {
    margin-left: 0;
}

.submenu a {
    display: block;
    padding: 10px 16px;
    white-space: nowrap;
}

      .logo-img {
    width: 100%;
    max-width: 100px; /* It will be 300px on desktop, but shrink on small phones */
    height: auto;
    border-radius: 8px;
          display: block;      /* Keeps the image on its own line */
    margin-left: 0;      /* Forces it to the left edge */
    margin-right: auto;  /* Pushes all extra space to the right */
    margin-top: 1rem;    /* Optional spacing above */
    margin-bottom: 1rem; /* Optional spacing below */
}

    /* Forms & Buttons */
    input, textarea, select {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
    }

      textarea {
    min-height: 600px;
    font-family: 'Montserrat', sans-serif;
}

    .btn {
        display: inline-block;
        background: var(--accent);
        color: white;
        padding: 12px 24px;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        border: none;
        cursor: pointer;
    }

    .social-links {
        margin-bottom: 15px;
    }

    .social-links a {
        color: var(--primary); /* Uses your dark blue/gray color */
        font-size: 1.5rem;      /* Makes the icons a nice size */
        margin: 0 10px;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .social-links a:hover {
        color: var(--accent);  /* Changes to your green 'accent' color on hover */
    }

    footer { text-align: center; padding: 40px; color: #777; }
      @media (max-width: 768px) {
    nav {
        flex-direction: column;
        align-items: center;
        padding: 1rem;
    }

    .nav-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 12px;
    margin-top: 10px;
}

    .nav-links li {
        margin-left: 0;
    }

   .nav-links a {
    font-size: 0.8rem;
}
    .container {
        padding: 1rem;
        max-width: 100%;
    }

    .hero-banner img {
        width: 100%;
        border-radius: 8px;
        margin-top: 1rem;
    }

    h1, h2 {
        font-size: 1.6rem;
        line-height: 1.3;
    }

    p {
        font-size: 1rem;
        line-height: 1.6;
    }

    textarea {
        min-height: 500px;
        font-size: 0.95rem;
    }

    .btn,
    button {
        width: 100%;
        font-size: 1rem;
        padding: 14px;
    }
}
      .leadership-hero {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    min-height: 600px;
    border-radius: 0;
    background-image:
        linear-gradient(
            to right,
            rgba(0,0,0,.70) 0%,
            rgba(0,0,0,.50) 38%,
            rgba(0,0,0,.15) 70%,
            rgba(0,0,0,0) 100%
        ),
        url('{{ site.baseurl }}/assets/contact-leadership-hero.png');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    overflow: hidden;
    margin-bottom: 40px;
}

.leadership-hero-content {
    max-width: 520px;
    padding: 60px;
    color: white;
}

.leadership-hero-content h1,
.leadership-hero-content p {
    color: white;
}

.leadership-hero-content h1 {
    font-size: 4rem;
    line-height: 1;
    margin-bottom: 25px;
}

.leadership-hero-content p {
    font-size: 1.1rem;
    line-height: 1.7;
    margin-bottom: 20px;
}

@media (max-width: 768px) {
    .leadership-hero {
        width: 100%;
        margin-left: 0;
        min-height: auto;
        background-image: url('{{ site.baseurl }}/assets/contact-leadership-hero-mobile-square.png');
        background-size: cover;
        background-position: center;
        display: block;
        border-radius: 8px;
        aspect-ratio: 1 / 1;
        margin-bottom: 20px;
    }

    .leadership-hero-content {
        background: white;
        color: var(--primary);
        padding: 24px 0 0 0;
        max-width: 100%;
    }

    .leadership-hero-content h1,
    .leadership-hero-content p {
        color: var(--primary);
    }

    .leadership-hero-content h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin-bottom: 18px;
    }

    .leadership-hero-content p {
        font-size: 1rem;
        line-height: 1.6;
    }

    .leadership-hero .btn {
        width: auto;
        display: inline-block;
    }
}
    </style> 
</head>
<body>
    <div id="fb-root"></div>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v25.0&appId=APP_ID"></script>
    {% include navigation.html %}

    <div class="container">
        {{ content }}
    </div>
<footer>
    <div class="social-links">
        <a href="https://www.facebook.com/gwinnettanimaladvocacyalliance" target="_blank" aria-label="Facebook">
            <i class="fab fa-facebook"></i>
        </a>
        <a href="https://www.instagram.com/gwinnettanimalshelteradvocates" target="_blank" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
        </a>
    </div>
    <p>&copy; 2026 Gwinnett Animal Advocacy Alliance</p>
    
</footer>
</body>
</html>
